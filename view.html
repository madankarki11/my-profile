<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI/UX Design madan karki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__profile">
      <img src="assets/images/profile.jpg" alt="Madan Karki profile photo" class="sidebar__profile-img">
    </div>
    <nav class="sidebar__nav" aria-label="Primary">
      <ul>
        <li>
          <a href="index.html#home" class="nav-link" data-section="home">
            <i class="nav-icon fa-solid fa-house"></i>
            <span>Home</span>
          </a>
        </li>
        <li>
          <a href="index.html#intro" class="nav-link" data-section="about">
            <i class="nav-icon fa-solid fa-user"></i>
            <span>About</span>
          </a>
        </li>
        <li>
          <a href="view.html" class="nav-link active" data-section="projects">
            <i class="nav-icon fa-solid fa-eye"></i>
            <span>View</span>
          </a>
        </li>
        <li>
          <a href="index.html#contact" class="nav-link" data-section="contact">
            <i class="nav-icon fa-solid fa-envelope"></i>
            <span>Contact</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main">

    <!-- Top Hero Section -->
    <section id="view-hero" class="section hero view-hero">
      <div class="hero__text">
        <h1 class="hero__title">UI/UX Design </h1>
        <p class="hero__subtitle"> My UI/UX Design Road Map.</p>
      </div>

      <div class="view-hero__badges">
        <button type="button" class="badge badge--btn" id="badge-figma" aria-expanded="false"
          title="Click to view Figma design">
          <i class="fa-brands fa-figma"></i> Figma <i class="fa-solid fa-arrow-down badge-arrow"></i>
        </button>
        <button type="button" class="badge badge--btn" id="badge-design-systems" aria-expanded="false"
          title="Click to view Design Systems workflow">
          <i class="fa-solid fa-layer-group"></i> Design Systems <i class="fa-solid fa-arrow-down badge-arrow"></i>
        </button>
        <span class="badge"><i class="fa-solid fa-mobile-screen-button"></i> Mobile &amp; Web</span>
        <span class="badge"><i class="fa-solid fa-code"></i> Frontend Ready</span>
      </div>

      <!-- Figma Project Preview (Revealed on Figma badge click) -->
      <div class="figma-preview-wrapper" id="figma-preview-wrapper">
        <div class="figma-preview-card">
          <div class="figma-preview-header">
            <div class="figma-preview-dots">
              <span></span><span></span><span></span>
            </div>
            <div class="figma-preview-title">
              <i class="fa-brands fa-figma"></i>
              <span>Smart Watch UI / UX Design</span>
            </div>
            <div class="figma-preview-actions">
              <button type="button" class="figma-preview-close" id="figma-preview-close"
                aria-label="Close Preview">&times;</button>
            </div>
          </div>
          <div class="figma-preview-body">
            <img src="assets/images/figma-image1.jpg"
              alt="Smart Watch UI UX Figma Design Wireframes and Screens by Madan Karki" class="figma-preview-img"
              id="figma-preview-img">
          </div>
        </div>
      </div>

      <!-- Design Systems Preview (Revealed on Design Systems badge click) -->
      <div class="figma-preview-wrapper" id="design-systems-preview-wrapper">
        <div class="figma-preview-card">
          <div class="figma-preview-header">
            <div class="figma-preview-dots">
              <span></span><span></span><span></span>
            </div>
            <div class="figma-preview-title">
              <i class="fa-solid fa-layer-group" style="color: #38bdf8;"></i>
              <span>Design Systems Workflow &amp; Methodology</span>
            </div>
            <div class="figma-preview-actions">
              <button type="button" class="figma-preview-close" id="design-systems-preview-close"
                aria-label="Close Preview">&times;</button>
            </div>
          </div>
          <div class="figma-preview-body">
            <img src="assets/images/design-systems.png"
              alt="Design Systems Roadmap: Low-Fidelity, Wireframing, Layout Design, Components, Design Planning"
              class="figma-preview-img" id="design-systems-preview-img">
          </div>
        </div>
      </div>

    </section>

  </main>

  <script>
    const figmaBtn = document.getElementById('badge-figma');
    const figmaWrapper = document.getElementById('figma-preview-wrapper');
    const figmaClose = document.getElementById('figma-preview-close');
    const figmaImg = document.getElementById('figma-preview-img');

    const dsBtn = document.getElementById('badge-design-systems');
    const dsWrapper = document.getElementById('design-systems-preview-wrapper');
    const dsClose = document.getElementById('design-systems-preview-close');
    const dsImg = document.getElementById('design-systems-preview-img');

    function closeFigma() {
      if (figmaWrapper && figmaBtn) {
        figmaWrapper.classList.remove('is-open');
        figmaBtn.classList.remove('is-active');
        figmaBtn.setAttribute('aria-expanded', 'false');
      }
    }

    function closeDesignSystems() {
      if (dsWrapper && dsBtn) {
        dsWrapper.classList.remove('is-open');
        dsBtn.classList.remove('is-active');
        dsBtn.setAttribute('aria-expanded', 'false');
      }
    }

    if (figmaBtn && figmaWrapper) {
      figmaBtn.addEventListener('click', () => {
        closeDesignSystems();
        const isOpen = figmaWrapper.classList.toggle('is-open');
        figmaBtn.classList.toggle('is-active', isOpen);
        figmaBtn.setAttribute('aria-expanded', isOpen);

        if (isOpen) {
          setTimeout(() => {
            figmaWrapper.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }, 200);
        }
      });
    }

    if (figmaClose) {
      figmaClose.addEventListener('click', closeFigma);
    }

    if (figmaImg) {
      figmaImg.addEventListener('click', () => {
        figmaImg.classList.toggle('is-zoomed');
      });
    }

    if (dsBtn && dsWrapper) {
      dsBtn.addEventListener('click', () => {
        closeFigma();
        const isOpen = dsWrapper.classList.toggle('is-open');
        dsBtn.classList.toggle('is-active', isOpen);
        dsBtn.setAttribute('aria-expanded', isOpen);

        if (isOpen) {
          setTimeout(() => {
            dsWrapper.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }, 200);
        }
      });
    }

    if (dsClose) {
      dsClose.addEventListener('click', closeDesignSystems);
    }

    if (dsImg) {
      dsImg.addEventListener('click', () => {
        dsImg.classList.toggle('is-zoomed');
      });
    }
  </script>

</body>

</html>
